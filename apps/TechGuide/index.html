<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headliner</title>
  <meta name="description" content="Landing page with expandable thumbnails.">
  <!-- config.css = settings, content.css = all text, style.css = layout -->
  <link rel="stylesheet" href="css/config.css">
  <link rel="stylesheet" href="css/content.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="page">

    <!-- Text is filled in from css/content.css -->
    <header class="hero">
      <h1 class="headline" data-intro-title></h1>
      <section class="intro" aria-labelledby="intro-heading">
        <h2 class="block-heading" id="intro-heading" data-intro-heading></h2>
        <div class="prose" data-intro-body></div>
      </section>
    </header>

    <!-- Thumbnails are generated by main.js from --thumb-count in config.css -->
    <section class="thumbs" data-thumbs aria-label="Gallery"></section>

  </main>

  <!-- Pop-up template, cloned under the row of the clicked thumbnail -->
  <template id="panel-template">
    <div class="panel-slot">
      <div class="panel-clip">
        <div class="panel-pad">
          <section class="panel" role="region">
            <button class="panel-close" type="button" aria-label="Close"></button>
            <div class="panel-content">
              <h2 class="block-heading" data-panel-heading></h2>
              <div class="prose" data-panel-body></div>
              <div class="media-grid" data-panel-media></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
